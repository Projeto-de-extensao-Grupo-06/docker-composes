apiVersion: 1

providers:
  - name: "observability-dashboards"
    orgId: 1
    folder: "Observability"       # pasta visível na UI
    folderUid: "folder-observability"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards

  - name: "analytics-dashboards"
    orgId: 1
    folder: "Analytics"
    folderUid: "folder-analytics"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards