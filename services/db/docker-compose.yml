version: "3.8"

services:
  redis:
    image: redis:7.4
    container_name: redis-multidb
    ports:
      - "${PORT_REDIS:-6379}:6379"
    command: [ "redis-server", "--databases", "3", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru" ]
    restart: unless-stopped
    networks:
      - storage_network

  db-oltp:
    image: mysql:8.0
    container_name: mysql-db-oltp
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD}}
      MYSQL_DATABASE: solarway
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PORT_MYSQL_OLTP:-3306}:3306"
    volumes:
      - ./init-oltp:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - storage_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD}}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-olap:
    image: mysql:8.0
    container_name: mysql-db-olap
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD}}
      MYSQL_DATABASE: solarway
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PORT_MYSQL_OLAP:-3308}:3308"
    volumes:
      - ./init-olap:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - storage_network

  # ---------------------------------------------------------------------------
  # Backup do banco transacional (OLTP) → S3
  # ---------------------------------------------------------------------------
  backup-oltp:
    image: amazon/aws-cli:latest
    container_name: mysql-backup-oltp
    restart: unless-stopped

    depends_on:
      db-oltp:
        condition: service_healthy

    environment:
      MYSQL_HOST: db-oltp
      MYSQL_PORT: 3306
      MYSQL_DATABASE: solarway
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD}}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}

      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-backups/oltp}

      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      EMAIL_TO: ${EMAIL_TO}

    volumes:
      - ./dump_to_s3.sh:/usr/local/bin/dump_to_s3.sh:ro

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        set -e

        dnf install -y mariadb105 gzip python3 cronie

        echo "[backup-oltp] configurando cron..."

        echo "${BACKUP_CRON} /usr/local/bin/dump_to_s3.sh >> /var/log/backup.log 2>&1" \
          | crontab -

        echo "[backup-oltp] cron configurado: ${BACKUP_CRON}"

        # inicia cron em foreground
        crond -n
    networks:
    - storage_network

networks:
  storage_network:
    external: true
    name: storage_network